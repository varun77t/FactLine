name: factline

x-app: &app
  build: .
  image: factline-app:latest
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
    HDFS_URL: http://namenode:9870
    HDFS_USER: hadoop
  volumes:
    - ./data:/app/data
    - ./models:/app/models

services:
  # ------------------------------------------------------------------ infrastructure
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "29092:29092"          # for clients running on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  namenode:
    image: apache/hadoop:3
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"            # NameNode web UI + WebHDFS
    env_file: hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /data/hdfs/namenode/name   # must not pre-exist, or the image skips formatting
    volumes:
      - hdfs-namenode:/data/hdfs/namenode
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 20s

  datanode:
    image: apache/hadoop:3
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    ports:
      - "9864:9864"            # DataNode web UI
    env_file: hadoop.env
    volumes:
      - hdfs-datanode:/data/hdfs/datanode
    depends_on:
      - namenode

  init:
    <<: *app
    command: ["python", "scripts/init_infra.py"]
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
      namenode: { condition: service_healthy }
      datanode: { condition: service_started }

  # ------------------------------------------------------------------ pipeline
  hdfs-sink:
    <<: *app
    command: ["python", "-m", "pipeline.hdfs_sink"]
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }

  producer:
    <<: *app
    profiles: ["jobs"]
    command: ["python", "-m", "pipeline.producer"]
    depends_on:
      init: { condition: service_completed_successfully }

  trainer:
    <<: *app
    profiles: ["jobs"]
    command: ["python", "-m", "pipeline.train"]
    depends_on:
      init: { condition: service_completed_successfully }

  live-scorer:
    <<: *app
    command: ["python", "-m", "pipeline.live_scorer"]
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }

  api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }

volumes:
  kafka-data:
  hdfs-namenode:
  hdfs-datanode:
